[project]
name = "flask-blog"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "v-schneider" }
]
requires-python = ">=3.15"
dependencies = [
    "bootstrap-flask>=2.6.0",
    "coverage>=7.17.2",
    "flask>=3.1.3",
    "pytest>=9.2.0",
]

[project.scripts]
flask-blog = "flask_blog:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["flask_blog"]
